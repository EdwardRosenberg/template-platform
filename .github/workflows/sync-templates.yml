name: Sync Templates

on:
  # Trigger manually to sync a specific template or all children
  workflow_dispatch:
    inputs:
      source-repo:
        description: 'Source template repo slug (e.g. EdwardRosenberg/template-base). Leave blank to sync all.'
        required: false
        default: ''
      dry-run:
        description: 'Dry run — detect changes but do not open PRs'
        type: boolean
        required: false
        default: false

  # Automatically trigger when a submodule commit is pushed to the platform
  push:
    branches: [main]
    paths:
      - 'templates/**'
      - '.gitmodules'

permissions:
  contents: read

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # 1. Read sync-config.yml from each template and build the propagation matrix.
  #
  # We do NOT use `submodules: recursive` here — that would require read access
  # to every submodule repo (including ones protected by branch rules) and would
  # fail if a submodule hasn't been pushed to GitHub yet.
  #
  # Instead we:
  #   a) Check out template-platform (no submodules) to read .gitmodules.
  #   b) For each child repo slug found in .gitmodules, fetch sync-config.yml
  #      directly from the GitHub Contents API using SYNC_TOKEN.
  # ─────────────────────────────────────────────────────────────────────────────
  build-matrix:
    name: Build propagation matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.build.outputs.matrix }}
    steps:
      - name: Checkout template-platform (no submodules)
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1

      - name: Build child→parent propagation pairs
        id: build
        env:
          SOURCE_REPO: ${{ inputs.source-repo }}
          GH_TOKEN:    ${{ secrets.SYNC_TOKEN }}
        run: |
          set -euo pipefail

          PAIRS="[]"

          # Read every submodule URL from .gitmodules
          # Output format:  submodule.<key>.url = <url>
          while IFS= read -r line; do
            # Extract the repo slug from the URL value
            child_url=$(echo "$line" | awk '{print $3}')
            child_slug=$(echo "$child_url" | sed 's|https://github.com/||;s|\.git$||')

            echo "--- Checking $child_slug ---"

            # Fetch sync-config.yml for this child via the GitHub Contents API
            api_url="https://api.github.com/repos/${child_slug}/contents/sync-config.yml"
            response=$(curl -sf \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github.raw+json" \
              "$api_url" 2>/dev/null || true)

            if [ -z "$response" ]; then
              echo "  No sync-config.yml found in $child_slug, skipping"
              continue
            fi

            # Parse parent, tier, sync_paths from the YAML content
            parent=$(echo "$response" | grep '^parent:' | awk '{print $2}' | tr -d '"' || true)
            tier=$(echo "$response"   | grep '^tier:'   | awk '{print $2}' || true)

            if [ -z "$parent" ]; then
              echo "  $child_slug has no parent (Tier 0), skipping"
              continue
            fi

            if [ -n "$SOURCE_REPO" ] && [ "$parent" != "$SOURCE_REPO" ]; then
              echo "  $child_slug parent is $parent, does not match filter '$SOURCE_REPO', skipping"
              continue
            fi

            sync_paths=$(python3 -c "
import yaml, json, sys
cfg = yaml.safe_load(sys.stdin.read())
print(json.dumps(cfg.get('sync_paths', [])))
" <<< "$response")

            pair=$(jq -n \
              --arg parent  "$parent" \
              --arg child   "$child_slug" \
              --arg tier    "$tier" \
              --argjson paths "$sync_paths" \
              '{parent: $parent, child: $child, tier: ($tier | tonumber), sync_paths: $paths}')

            PAIRS=$(echo "$PAIRS" | jq --argjson p "$pair" '. + [$p]')
            echo "  Registered: $parent → $child_slug (tier $tier)"

          done < <(git config --file .gitmodules --get-regexp 'submodule\..*\.url')

          echo "matrix={\"include\":$(echo "$PAIRS")}" >> "$GITHUB_OUTPUT"
          echo "Propagation matrix:"
          echo "$PAIRS" | jq .

  # ─────────────────────────────────────────────────────────────────────────────
  # 2. For each parent→child pair, compare shared paths and open a PR if changed
  # ─────────────────────────────────────────────────────────────────────────────
  propagate:
    name: Propagate ${{ matrix.parent }} → ${{ matrix.child }}
    needs: build-matrix
    if: ${{ needs.build-matrix.outputs.matrix != '{"include":[]}' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.build-matrix.outputs.matrix) }}
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout parent template
        uses: actions/checkout@v4
        with:
          repository: ${{ matrix.parent }}
          token: ${{ secrets.SYNC_TOKEN }}
          path: parent
          fetch-depth: 1

      - name: Checkout child template
        uses: actions/checkout@v4
        with:
          repository: ${{ matrix.child }}
          token: ${{ secrets.SYNC_TOKEN }}
          path: child
          fetch-depth: 1

      - name: Copy changed sync_paths from parent into child
        id: copy
        run: |
          set -euo pipefail

          CHANGED=false
          CHANGED_FILES=""

          # Read sync_paths from the matrix JSON
          SYNC_PATHS='${{ toJson(matrix.sync_paths) }}'

          for path in $(echo "$SYNC_PATHS" | jq -r '.[]'); do
            src="parent/$path"
            dst="child/$path"

            if [ ! -f "$src" ]; then
              echo "WARNING: $path does not exist in parent, skipping"
              continue
            fi

            mkdir -p "$(dirname "$dst")"

            if ! diff -q "$src" "$dst" > /dev/null 2>&1; then
              echo "CHANGED: $path"
              cp "$src" "$dst"
              CHANGED=true
              CHANGED_FILES="$CHANGED_FILES\n- $path"
            else
              echo "UNCHANGED: $path"
            fi
          done

          echo "changed=$CHANGED" >> "$GITHUB_OUTPUT"
          # Write changed file list to a temp file for the PR body step
          printf "$CHANGED_FILES" > /tmp/changed_files.txt

      - name: Skip — no changes detected
        if: steps.copy.outputs.changed != 'true'
        run: echo "No sync changes detected for ${{ matrix.child }}. Nothing to do."

      - name: Open PR with synced changes
        if: steps.copy.outputs.changed == 'true' && (github.event_name != 'workflow_dispatch' || inputs.dry-run != true)
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN }}
          CHILD_REPO: ${{ matrix.child }}
          PARENT_REPO: ${{ matrix.parent }}
        run: |
          set -euo pipefail

          BRANCH="sync/from-$(echo "$PARENT_REPO" | tr '/' '-')-$(date +%Y%m%d%H%M%S)"
          CHANGED_FILES=$(cat /tmp/changed_files.txt)

          cd child
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add -A
          git commit -m "chore: sync shared paths from $PARENT_REPO"
          git push origin "$BRANCH"

          gh pr create \
            --repo "$CHILD_REPO" \
            --head "$BRANCH" \
            --base main \
            --title "chore: sync shared paths from $PARENT_REPO" \
            --body "## Automated Sync PR

          This PR was opened automatically by the **template-platform sync workflow**.

          ### Source
          Parent template: \`$PARENT_REPO\`

          ### Changed paths
          ${CHANGED_FILES}

          ### What to do
          1. Review the diff below — these files are owned by the parent template.
          2. Merge if the changes look correct.
          3. Do **not** manually edit the synced files; raise changes in the parent template instead.

          ---
          *Generated by \`.github/workflows/sync-templates.yml\` in \`template-platform\`.*"

      - name: Dry run summary
        if: steps.copy.outputs.changed == 'true' && github.event_name == 'workflow_dispatch' && inputs.dry-run == true
        run: |
          echo "DRY RUN — changes detected for ${{ matrix.child }}, but no PR opened."
          echo "Changed files:"
          cat /tmp/changed_files.txt

